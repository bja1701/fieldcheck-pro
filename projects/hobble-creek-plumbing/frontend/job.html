<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldCheck Pro — Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        [x-cloak] { display: none !important; }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
            50%       { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
        }
        .step-running { animation: pulse-ring 1.8s ease-in-out infinite; }

        @keyframes bar-stripes {
            from { background-position: 40px 0; }
            to   { background-position: 0 0; }
        }
        .bar-animated {
            background-image: linear-gradient(
                45deg, rgba(255,255,255,0.15) 25%, transparent 25%,
                transparent 50%, rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0.15) 75%, transparent 75%, transparent
            );
            background-size: 40px 40px;
            animation: bar-stripes 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen" x-data="jobApp()" x-init="init()">

    <!-- Header -->
    <header class="bg-gradient-to-r from-slate-900 to-indigo-900 text-white px-4 py-3 shadow-lg sticky top-0 z-40">
        <div class="max-w-2xl mx-auto flex items-center gap-3">
            <a href="projects.html" class="text-indigo-300 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-white/10 -ml-1.5 min-h-[40px] flex items-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <div class="flex-1 min-w-0">
                <h1 class="text-base font-bold tracking-tight truncate leading-tight"
                    x-text="project?.name || 'Pipeline'">Pipeline</h1>
                <p class="text-xs font-medium text-indigo-300 leading-tight">Processing job</p>
            </div>
            <!-- Live indicator -->
            <div x-show="isLive" x-cloak class="flex items-center gap-1.5 text-xs font-semibold text-green-300">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                Live
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6 space-y-4" x-cloak>

        <!-- ── STATUS CARD ─────────────────────────────────────────────────── -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

            <!-- Coloured top strip -->
            <div class="h-1.5 transition-all duration-700"
                 :class="{
                   'bg-gradient-to-r from-indigo-500 to-violet-500 bar-animated': status.status === 'processing' || status.status === 'running',
                   'bg-gradient-to-r from-green-400 to-emerald-500': status.status === 'complete',
                   'bg-red-500': status.status === 'error',
                   'bg-slate-200': status.status === 'pending',
                 }"></div>

            <div class="p-6">
                <!-- Label + % -->
                <div class="flex items-start justify-between gap-4 mb-4">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Pipeline Status</p>
                        <p class="text-slate-900 font-bold text-xl leading-tight" x-text="statusLabel(status.status)"></p>
                        <p class="text-slate-500 text-sm mt-1" x-show="status.step_label && status.status !== 'complete' && status.status !== 'error'"
                           x-text="status.step_label"></p>
                    </div>
                    <div class="text-right shrink-0">
                        <span class="text-3xl font-extrabold tabular-nums"
                              :class="status.status === 'error' ? 'text-red-500' : 'text-indigo-600'"
                              x-text="pctComplete + '%'"></span>
                    </div>
                </div>

                <!-- Progress bar -->
                <div class="w-full bg-slate-100 rounded-full h-3 mb-2 overflow-hidden">
                    <div class="h-3 rounded-full transition-all duration-700 ease-out"
                         :class="{
                           'bg-indigo-500': status.status !== 'error' && status.status !== 'complete',
                           'bg-green-500': status.status === 'complete',
                           'bg-red-500': status.status === 'error',
                         }"
                         :style="'width:' + pctComplete + '%'"></div>
                </div>

                <!-- Error message + retry -->
                <div x-show="status.status === 'error'" x-cloak class="mt-4 space-y-3">
                    <div class="flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-medium">
                        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                        </svg>
                        <span x-text="status.error || 'Pipeline encountered an error.'"></span>
                    </div>
                    <button @click="retryPipeline()"
                            :disabled="retrying"
                            class="flex items-center gap-2 text-sm font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 transition-colors disabled:opacity-50 min-h-[44px]">
                        <svg class="w-4 h-4" :class="retrying ? 'animate-spin' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span x-text="retrying ? 'Restarting…' : 'Retry Pipeline'"></span>
                    </button>
                </div>

                <!-- Complete CTA -->
                <div x-show="status.status === 'complete'" x-cloak class="mt-5">
                    <a :href="'bid-check.html?id=' + projectId"
                       class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-3 rounded-xl text-sm transition-all min-h-[48px] shadow-sm shadow-green-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Open Bid Check
                    </a>
                </div>

                <!-- Live refresh note -->
                <p x-show="isLive" x-cloak class="text-xs text-slate-400 mt-4 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-300 animate-pulse"></span>
                    Updating automatically every 3 seconds
                </p>
            </div>
        </div>

        <!-- ── STEPS ────────────────────────────────────────────────────────── -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-5">Steps</p>
            <ol class="space-y-4">
                <template x-for="(step, i) in STEPS" :key="i">
                    <li class="flex items-center gap-4">
                        <!-- Icon bubble -->
                        <div class="w-9 h-9 rounded-full border-2 flex items-center justify-center shrink-0 transition-all duration-300"
                             :class="stepBubbleClass(i)">
                            <!-- Done -->
                            <svg x-show="stepState(i) === 'done'" class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                            </svg>
                            <!-- Running -->
                            <svg x-show="stepState(i) === 'running'" class="w-4 h-4 text-indigo-600 animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                            <!-- Error -->
                            <svg x-show="stepState(i) === 'error'" class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                            <!-- Pending number -->
                            <span x-show="stepState(i) === 'pending'" class="text-xs font-bold text-slate-400" x-text="i + 1"></span>
                        </div>

                        <!-- Label + connector line -->
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold leading-tight"
                               :class="{
                                 'text-slate-900': stepState(i) === 'running',
                                 'text-green-700': stepState(i) === 'done',
                                 'text-red-600':   stepState(i) === 'error',
                                 'text-slate-400': stepState(i) === 'pending',
                               }"
                               x-text="step.label"></p>
                            <p x-show="stepState(i) === 'running'" x-cloak
                               class="text-xs text-indigo-500 font-medium mt-0.5">Running…</p>
                            <p x-show="stepState(i) === 'done'" x-cloak
                               class="text-xs text-green-600 font-medium mt-0.5">Done</p>
                        </div>

                        <!-- Step timing chip (when done) -->
                        <span x-show="stepState(i) === 'done'" x-cloak
                              class="text-xs text-green-600 font-semibold bg-green-50 px-2 py-0.5 rounded-full shrink-0">✓</span>
                    </li>
                </template>
            </ol>
        </div>

        <!-- ── LOG ──────────────────────────────────────────────────────────── -->
        <div x-show="status.log && status.log.length > 0" x-cloak
             class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <p class="text-xs font-bold uppercase tracking-widest text-slate-400">Log</p>
                <span class="text-xs text-slate-400 tabular-nums" x-text="status.log?.length + ' lines'"></span>
            </div>
            <div class="bg-slate-900 max-h-52 overflow-y-auto" id="log-container">
                <div class="p-4 space-y-0.5">
                    <template x-for="(line, i) in status.log" :key="i">
                        <p class="text-xs font-mono text-slate-300 leading-5 whitespace-pre-wrap break-all" x-text="line"></p>
                    </template>
                </div>
            </div>
        </div>

    </main>

    <script>
        const STEPS = [
            { label: 'Parse bid sheet' },
            { label: 'Scrape spec book' },
            { label: 'Analyze house plans' },
            { label: 'Analyze cabinet drawings' },
            { label: 'Run match engine' },
            { label: 'Generate output' },
        ];

        function jobApp() {
            return {
                supabase: null, project: null, projectId: null,
                pollTimer: null, retrying: false,
                status: { status: 'pending', step: 0, step_label: '', total_steps: 6, log: [], error: null },
                STEPS,

                get isLive() { return this.status.status === 'processing' || this.status.status === 'running' || this.status.status === 'pending'; },

                get pctComplete() {
                    const s = this.status;
                    if (s.status === 'complete') return 100;
                    if (s.status === 'error') return Math.max(5, Math.round(((s.step||0) / (s.total_steps||6)) * 100));
                    if (s.status === 'pending') return 0;
                    return Math.max(5, Math.min(95, Math.round(((s.step||0) / (s.total_steps||6)) * 100)));
                },

                async init() {
                    this.supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (!session) { window.location.replace('login.html'); return; }

                    const params = new URLSearchParams(window.location.search);
                    this.projectId = params.get('id');
                    if (!this.projectId) { window.location.replace('projects.html'); return; }

                    const { data } = await this.supabase.from('projects').select('*').eq('id', this.projectId).single();
                    this.project = data;
                    if (data?.name) document.title = `${data.name} — FieldCheck Pro`;
                    // Seed status from Supabase so error/complete state shows immediately
                    // even if Railway restarted and lost pipeline_jobs.json
                    if (data?.status === 'error') this.status = { ...this.status, status: 'error', error: 'Pipeline failed. Click Retry to try again.' };
                    if (data?.status === 'review' || data?.status === 'complete') this.status = { ...this.status, status: 'complete', step: 6 };

                    // Only poll Railway if we don't already have a terminal state from Supabase.
                    // Railway loses pipeline_jobs.json on restart and returns 'pending',
                    // which would overwrite the error state and hide the retry button.
                    const isTerminal = this.status.status === 'error' || this.status.status === 'complete';
                    if (!isTerminal) {
                        await this.pollStatus();
                        this.pollTimer = setInterval(() => this.pollStatus(), 3000);
                    }
                },

                async pollStatus() {
                    try {
                        const res = await fetch(`${window.API_SERVER_URL}/api/project-status?id=${this.projectId}`);
                        if (!res.ok) return;
                        this.status = await res.json();

                        // Auto-scroll log
                        this.$nextTick(() => {
                            const c = document.getElementById('log-container');
                            if (c) c.scrollTop = c.scrollHeight;
                        });

                        if (this.status.status === 'complete' || this.status.status === 'error') {
                            clearInterval(this.pollTimer);
                            const newStatus = this.status.status === 'complete' ? 'review' : 'error';
                            await this.supabase.from('projects').update({ status: newStatus }).eq('id', this.projectId);
                        }
                    } catch (_) { /* server not reachable — stay pending */ }
                },

                async retryPipeline() {
                    this.retrying = true;
                    try {
                        // Fetch stored file paths from project_documents
                        const { data: docs } = await this.supabase
                            .from('project_documents').select('*').eq('project_id', this.projectId);
                        if (!docs?.length) { alert('Could not find project files to retry.'); return; }

                        const specDoc    = docs.find(d => d.doc_type === 'spec_url');
                        const bidDoc     = docs.find(d => d.doc_type === 'bid_spreadsheet');
                        const plansDoc   = docs.find(d => d.doc_type === 'plans_pdf');
                        const cabDoc     = docs.find(d => d.doc_type === 'cabinets_pdf');

                        // Generate fresh signed URLs (1 hour)
                        const sign = async (path) => {
                            const { data } = await this.supabase.storage
                                .from('project-files').createSignedUrl(path, 3600);
                            return data?.signedUrl;
                        };
                        const [bidUrl, plansUrl, cabUrl] = await Promise.all([
                            sign(bidDoc.file_path), sign(plansDoc.file_path), sign(cabDoc.file_path)
                        ]);

                        // Reset status and restart poll
                        this.status = { status: 'pending', step: 0, step_label: 'Restarting…', total_steps: 6, log: [], error: null };
                        await this.supabase.from('projects').update({ status: 'processing' }).eq('id', this.projectId);
                        clearInterval(this.pollTimer);

                        const { data: { session: retrySess } } = await this.supabase.auth.getSession();
                        await fetch(`${window.API_SERVER_URL}/api/run-pipeline`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                project_id: this.projectId,
                                project_name: this.project?.name || 'Untitled',
                                spec_url: specDoc.spec_url,
                                bid_url: bidUrl, plans_url: plansUrl, cabinets_url: cabUrl,
                                access_token: retrySess?.access_token || '',
                            }),
                        });

                        this.pollTimer = setInterval(() => this.pollStatus(), 3000);
                    } catch (e) {
                        alert('Retry failed: ' + e.message);
                    } finally {
                        this.retrying = false;
                    }
                },

                stepState(i) {
                    const s = this.status;
                    if (s.status === 'complete') return 'done';
                    if (s.status === 'error' && i === (s.step||0) - 1) return 'error';
                    if (i < (s.step||0)) return 'done';
                    if (i === (s.step||0) && (s.status === 'processing' || s.status === 'running')) return 'running';
                    return 'pending';
                },

                stepBubbleClass(i) {
                    const state = this.stepState(i);
                    return {
                        'border-green-400 bg-green-50 step-running':   false, // no pulse for done
                        'border-green-400 bg-green-50':                state === 'done',
                        'border-indigo-400 bg-indigo-50 step-running': state === 'running',
                        'border-red-400 bg-red-50':                    state === 'error',
                        'border-slate-200 bg-white':                   state === 'pending',
                    };
                },

                statusLabel(s) {
                    return { pending:'Queued — waiting to start', processing:'Pipeline running',
                             running:'Pipeline running', complete:'Complete — ready to review!',
                             review:'Complete — ready to review!', error:'Pipeline error' }[s] || s;
                },
            };
        }
    </script>
</body>
</html>
